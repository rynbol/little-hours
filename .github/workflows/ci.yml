name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run guard
        env:
          GUARD_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm test
      - run: npm run verify:room
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence
          path: test-results
          retention-days: 7

  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        flow: [avatar, companions, controls, decorate, doors, house, pet, pond, room-picker, rooms, timer]
    name: flow (${{ matrix.flow }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: echo "CHROME_PATH=$(node -e "import('@playwright/test').then(p => console.log(p.chromium.executablePath()))")" >> "$GITHUB_ENV"
      - run: npm run lh -- run ${{ matrix.flow }}
        env:
          LH_SLOW: '4'
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lh-evidence-${{ matrix.flow }}
          path: .lh/out
          retention-days: 7
