name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run guard
        env:
          GUARD_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm test
      - run: npm run verify:room
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [development, production]
        shard: [1, 2, 3, 4]
        include:
          - suite: development
            config: playwright.config.js
          - suite: production
            config: playwright.production.config.js
    name: browser (${{ matrix.suite }}, ${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config ${{ matrix.config }} --shard=${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence-${{ matrix.suite }}-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flow: [atmosphere, avatar, buddy, clouds, companions, controls, decorate, doors, focus, forest, house, landmarks, lightning, living-garden, motion, pet, pond, pond-grass, pond-zoom, rainbow, rooms, sun-air, timer, transitions, valley-air, wilds, wilds-style, window-cut]
    name: flow (${{ matrix.flow }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: echo "CHROME_PATH=$(node -e "import('@playwright/test').then(p => console.log(p.chromium.executablePath()))")" >> "$GITHUB_ENV"
      - run: npm run lh -- run ${{ matrix.flow }} --timeout 1500
        env:
          LH_SLOW: '6'
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lh-evidence-${{ matrix.flow }}
          path: .lh/out
          retention-days: 7
