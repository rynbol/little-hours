<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Hours · isolated house check</title></head>
<body><div id="app"></div><script type="module">
// Development-only browser fixture. It uses its own session save, never the
// player's localStorage. Clock controls exercise real completion/purchase UI.
if (!import.meta.env.DEV) throw new Error('Development check only');
const originalNow = Date.now;
let offset = Number(sessionStorage.getItem('house-check-clock')) || 0;
Date.now = () => originalNow() + offset;
window.__littleHoursTest = { storage: {
  getItem: () => sessionStorage.getItem('house-check-save'),
  setItem: (_, value) => sessionStorage.setItem('house-check-save', value),
} };
await import('../src/main.js');
const controls = document.createElement('nav');
controls.setAttribute('aria-label', 'Isolated test controls');
controls.style.cssText = 'position:fixed;bottom:6px;left:6px;max-width:calc(100% - 12px);z-index:1000;display:flex;flex-wrap:wrap;gap:5px;padding:6px;background:#eee;color:#222;border:1px solid #333;border-radius:5px;font:11px sans-serif';
controls.innerHTML = '<span>TEST SAVE</span><button id="advance">Advance 25 minutes</button><button id="reset-check">Reset test save</button><button id="measure">Measure overview</button><output id="measurement"></output>';
document.body.append(controls);
document.querySelector('#advance').onclick = () => { offset += 25 * 60_000; sessionStorage.setItem('house-check-clock', offset); document.dispatchEvent(new Event('visibilitychange')); };
document.querySelector('#reset-check').onclick = () => { sessionStorage.removeItem('house-check-save'); sessionStorage.removeItem('house-check-clock'); location.reload(); };
document.querySelector('#measure').onclick = async () => {
  const app = window.__littleHours, start = app.house.diagnostics(), roomFrame = app.room.diagnostics().scene.getFrameId();
  if (!start) { document.querySelector('#measurement').textContent = 'Open the house first'; return; }
  await new Promise(resolve => setTimeout(resolve, 2000));
  const end = app.house.diagnostics();
  document.querySelector('#measurement').textContent = end ? `${end.drawCalls} draw calls · ${Math.round(end.triangles)} triangles · ${end.renderCount - start.renderCount} idle overview frames · ${app.room.diagnostics().scene.getFrameId() - roomFrame} background room frames in 2s` : 'House closed';
};
</script></body></html>
